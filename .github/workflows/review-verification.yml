name: PR 1171 removal verification
on:
  push:
    branches: ['codex/verify-1171-20261008']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ab1d590c70166afa74af7fdf0186b629002cd6f
          submodules: recursive
          fetch-depth: 0
      - name: Prepare requested removal
        run: |
          git rev-parse HEAD
          git rm build/docker/run_test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.devel
          push: false
          load: true
          tags: huatuo-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build, check and vendor
        run: |
          set -o pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace huatuo-dev:latest sh -xec '
            git config --global --add safe.directory /workspace
            make build
            make --trace check
            make vendor
            git diff --exit-code
            test "$(git diff --cached --name-only)" = build/docker/run_test.sh
          ' 2>&1 | tee verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1171-removal-evidence
          path: verification.log
